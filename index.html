<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life to Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- SVG pixelation filter for feminine pixel-degradation effect -->
  <svg style="position:absolute;width:0;height:0">
    <filter id="pixelate-sm"><feFlood x="1" y="1" height="2" width="2"/><feComposite width="5" height="5"/><feTile result="a"/><feComposite in="SourceGraphic" in2="a" operator="in"/><feMorphology operator="dilate" radius="2.5"/></filter>
    <filter id="pixelate-lg"><feFlood x="2" y="2" height="3" width="3"/><feComposite width="8" height="8"/><feTile result="a"/><feComposite in="SourceGraphic" in2="a" operator="in"/><feMorphology operator="dilate" radius="4"/></filter>
  </svg>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Landing -->
    <section id="landing" class="screen active">
      <canvas id="landing-canvas"></canvas>
      <div class="landing-content">
        <div class="landing-label">personality quiz</div>
        <h1 class="hero-title" data-text="Life to Animation">Life<br>to<br>Animation</h1>
        <p class="hero-sub">Answer nine questions.<br>Watch your personality come alive.</p>
        <button id="start-btn" class="btn-main">Start &rarr;</button>
        <div class="api-key-section">
          <label class="api-key-label" for="api-key-input">OpenAI API Key</label>
          <input type="password" id="api-key-input" class="api-key-input" placeholder="Paste your key for AI-generated art" autocomplete="off">
          <a href="https://platform.openai.com/api-keys" target="_blank" class="api-key-link">Get an API key &rarr;</a>
        </div>
      </div>
    </section>

    <!-- Quiz -->
    <section id="quiz" class="screen">
      <div class="quiz-top">
        <div class="quiz-counter" id="quiz-counter">01 / 09</div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
      <div class="quiz-body">
        <h2 class="question-text" id="question-text"></h2>
        <div class="options" id="options"></div>
      </div>
    </section>

    <!-- Generating -->
    <section id="generating" class="screen">
      <div class="gen-content">
        <canvas id="gen-canvas"></canvas>
        <div class="gen-text">
          <span class="gen-label">Generating</span>
          <div class="gen-dots"><span></span><span></span><span></span></div>
        </div>
      </div>
    </section>

    <!-- Result -->
    <section id="result" class="screen">
      <div class="result-layout">
        <div class="result-left">
          <div class="result-label">Your archetype</div>
          <h1 class="result-title" id="result-title"></h1>
          <p class="result-description" id="result-description"></p>
          <div class="result-traits" id="result-traits"></div>
          <button id="restart-btn" class="btn-main">Retake &rarr;</button>
        </div>
        <div class="result-right">
          <img id="ai-image" class="ai-image" alt="AI-generated personality art" style="display:none;">
          <canvas id="animation-canvas"></canvas>
        </div>
      </div>
    </section>
  </div>

  <script src="quiz.js"></script>
  <script src="animation.js"></script>
  <script src="app.js"></script>
</body>
</html>
